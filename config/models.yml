# Models to track. One file per project phase.
# Add/remove here; the next `dirtbike watch` (cron, from the prod clone after deploy) picks it up.
# Every entry sets goal: project (a bike to wrench on: needing work scores up) or ride (ready to
# ride: needing work scores down, safety/certified scores up). See README "Fit".
# min_year / max_year are the model's production years: a listing outside them is another
# bike or a typo, and is skipped (an unknown year passes).

# Priority targets right now (dad-and-sons trail bikes)
priority:
  - slug: crf150f
    goal: project
    min_year: 2003
    max_year: 2017
    sources: [kijiji, autotrader, facebook, sturgess]
    target_price: 2500       # alert immediately if below this, regardless of market
    notes: "12yo's primary bike. Both brothers ride."

  - slug: crf230f
    goal: project
    min_year: 2003
    max_year: 2019
    sources: [kijiji, autotrader, facebook, sturgess]
    target_price: 3000
    notes: "15yo's bike. Discontinued 2019, tight supply."

