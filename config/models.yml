# Models to track. One file per project phase.
# Add/remove here; the next `dirtbike watch` (cron, from the prod clone after deploy) picks it up.
# Every entry sets goal: project (a bike to wrench on: needing work scores up) or ride (ready to
# ride: needing work scores down, safety/certified scores up). See README "Fit".
# min_year / max_year are the model's production years: a listing outside them is another
# bike or a typo, and is skipped (an unknown year passes).
# goal: ride models also skip listings under $1,000 (scoring.RIDE_MIN_PRICE): parts and toys.
# make names the brand for the dashboard's per-tab make filter; cc is the size class (150 for a
# 157 cc CRF150F) for its cc filter.
# sources are the searches; dealers below are added to every model (or to the groups listed).

# Whole-inventory dealers (one fetch is the dealer's whole used stock, filtered by title per
# model), checked for every model or only `groups`. `platform` picks the adapter (cli.PLATFORMS:
# dealerspike, escsite, focus, shoparide); location is the dealer's, for units that don't name a store.
# A new dealer on one of those platforms is a block here, no code. new_stock: true also feeds
# the new-bike markdown watch (focus only).
dealers:
  sturgess:
    platform: dealerspike
    url: https://www.sturgesscycle.com
    site_id: 5620  # Dealer Spike's id for the dealer, in its inventory file's path
    location: Hamilton, ON
  cycleworld:
    platform: escsite
    url: https://cycleworldsuperstore.com
    location: Scarborough, ON
    groups: [street, middleweight, dualsport]  # carries no dirt bikes
  dewildt:
    platform: escsite
    url: https://dewildtmarine.com
    path: /Pre-Owned-Inventory/  # escsite's default is /Pre-Owned/
    location: Hamilton, ON
  delmastro:
    platform: focus
    url: https://www.delmastro.ca
    location: Cavan Monaghan, ON
    dealer: Del Mastro  # display name in markdown alerts
    new_stock: true
  shoparide:  # Power Go's marketplace: ~120 Ontario dealers' stock, located per unit (#145)
    platform: shoparide
    url: https://www.shoparide.ca
    province: Ontario

