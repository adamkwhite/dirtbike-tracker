# A friend's watchlist: run with `dirtbike --config config/friend.yml watch` and his own NTFY_TOPIC.
# Shares the listings DB with models.yml; keeps its own alert state (data/state/friend/) and
# dashboard (dashboard-friend.html). Fields beyond models.yml's:
#   query        search text when the slug isn't it (the slug still matches titles, separators ignored)
#   include_new  keep dealer new stock (models.yml models skip it: MSRP isn't the used market)
#   min_year     drop older bikes (an unknown year passes)
#   require      words the title must name ("RS" keeps RS, drops RX/RR/base)
#   alert: all   push every new listing and every price drop, not only deals

triumph:
  - slug: speedtwin          # Speed Twin 900 has no RS, so "speedtwin" + RS is the 1200 RS
    query: speed twin 1200
    goal: ride
    sources: [kijiji, autotrader, facebook]
    include_new: true
    min_year: 2025
    require: [RS]
    alert: all
    notes: "Speed Twin 1200 RS, 2025+. Triumph promo on now"

  - slug: speedtriple        # titles vary: "Speed Triple RS ~ 1200CC", "Speed Triple 1200 RS"
    query: speed triple 1200
    goal: ride
    sources: [kijiji, autotrader, facebook]
    include_new: true
    min_year: 2026
    require: [RS]
    alert: all
    notes: "Speed Triple 1200 RS, 2026+"

bmw:
  - slug: r12ninet           # "BMW R 12 nineT" and "R12 Nine T" both match
    query: r12 ninet
    goal: ride
    sources: [kijiji, autotrader, facebook]
    include_new: true
    min_year: 2025
    require: ["719"]
    alert: all
    notes: "R 12 nineT, Option 719 only"
