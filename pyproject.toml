[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dirtbike-tracker"
version = "0.1.0"
description = "dirtbike tracker"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
authors = [
    {name = "Adam White", email = "adamkwhite@gmail.com"}
]
keywords = ["ai", "llm", "agent", "langchain"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
]

# Dependencies - mirror requirements.txt for now
# In the future, manage dependencies here and generate requirements.txt
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.15.10",
    "mypy>=1.7.0",
    "pre-commit>=4.5.1",
]

[project.scripts]
dirtbike = "dirtbike_tracker.application.cli:cli"

[project.urls]
Homepage = "https://github.com/adamkwhite/dirtbike-tracker"
Documentation = "https://github.com/adamkwhite/dirtbike-tracker"
Repository = "https://github.com/adamkwhite/dirtbike-tracker"
Issues = "https://github.com/adamkwhite/dirtbike-tracker/issues"

# === RUFF CONFIGURATION ===
[tool.ruff]
line-length = 100
target-version = "py313"

exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Enable pycodestyle (E), Pyflakes (F), isort (I), and other rules
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "SIM",    # flake8-simplify
    "ARG",    # flake8-unused-arguments
    "BLE",    # flake8-blind-except — catches `except Exception`
    "TRY",    # tryceratops — exception-handling anti-patterns
    "LOG",    # flake8-logging — logging API misuse
    "G",      # flake8-logging-format — f-strings / bad format args in logging
    "T20",    # flake8-print — push output toward logging
    "RUF100", # unused noqa — stale suppressions fail CI
]

ignore = [
    "E501",   # line too long (handled by ruff format)
    "B008",   # function calls in argument defaults
    "B905",   # zip without explicit strict parameter
    "TRY003", # long exception messages outside exception classes — too noisy for a default
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # Allow unused imports in __init__.py
"tests/**" = ["ARG"]      # Fixtures pass unused args

[tool.ruff.lint.isort]
known-first-party = ["src"]

# === MYPY CONFIGURATION ===
[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true for stricter typing
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
show_error_codes = true
exclude = [
    "venv/",
    ".venv/",
    "build/",
    "dist/",
]

# Per-module options
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# === PYTEST CONFIGURATION ===
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# === COVERAGE CONFIGURATION ===
[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

# === BANDIT SECURITY CONFIGURATION ===
[tool.bandit]
exclude_dirs = [
    "tests",
    ".venv",
    "venv",
]
skips = [
    "B101",  # assert_used - we use asserts in tests
    "B601",  # paramiko_calls - if you use paramiko
]
